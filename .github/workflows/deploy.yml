name: Deploy to Render

on:
  push:
    branches: [ master ]

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Library/Library.csproj

    - name: Install EF Tools
      run: dotnet tool install --global dotnet-ef

    - name: Remove old migrations
      run: rm -rf Library/Migrations

    - name: Generate migrations
      run: |
        dotnet build Library/Library.csproj --verbosity detailed
        dotnet ef migrations add Init --context AppDbContext --project Library/Library.csproj
        dotnet ef migrations add Init --context AppIdentityDbContext --project Library/Library.csproj

    - name: Commit migrations
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add Library/Migrations
        git diff --staged --quiet || git commit -m "Regenerate SQLite migrations"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
